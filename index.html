<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErunMyCirco</title>
    <link rel="stylesheet" href="./public/reset.css">
    <link rel="stylesheet" href="./public/variables.css">
    <link rel="stylesheet" href="./public/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <link rel="preconnect" href="https://fonts.bunny.net">
     <link href="https://fonts.bunny.net/css?family=montserrat:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i|roboto:100,100i,300,300i,400,400i,500,500i,700,700i,900,900i" rel="stylesheet" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="./public/js/app.js" type="module"></script>
</head>
<body>
    <div class="map-container">
        <div class="header">
            <div class="search-container">
                <form class="search-bar" method="get">
                    <input type="text" class="recherche" placeholder="rechercher une école par son nom, son mail, son téléphone, ...">
                    <button type="submit" class="validation">
                        <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="100" height="100" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M 9 2 C 5.1458514 2 2 5.1458514 2 9 C 2 12.854149 5.1458514 16 9 16 C 10.747998 16 12.345009 15.348024 13.574219 14.28125 L 14 14.707031 L 14 16 L 20 22 L 22 20 L 16 14 L 14.707031 14 L 14.28125 13.574219 C 15.348024 12.345009 16 10.747998 16 9 C 16 5.1458514 12.854149 2 9 2 z M 9 4 C 11.773268 4 14 6.2267316 14 9 C 14 11.773268 11.773268 14 9 14 C 6.2267316 14 4 11.773268 4 9 C 4 6.2267316 6.2267316 4 9 4 z"></path>
                        </svg>
                    </button>
                </form>
                <div class="suggestions"></div>
            </div>
            <div class="selectMenu">
                <select name="" id="circoSelect">
                    <option value="">--choisissez une circo--</option>
                </select>
            </div>
        </div>
        <div id="map"></div>
        <div class="sidebar sidebar--right hidden">
            <div class="sidebarButton sidebarButton--right">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </div>
            <div class="sidebarContainer sidebarContainer--right"></div>
        </div>
        <div class="sidebar sidebar--left hidden--left">
            <div class="sidebarContainer sidebarContainer--left"></div>
            <div class="sidebarButton sidebarButton--left">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </div>
        </div>
        <div class="mvtIntra">
            <span class="texte-long">Filtrer les écoles par distances</span>
            <span class="texte-court">Filtrer</span>
        </div>
        <div class="modale--overlay hiddenModale">
            <form class="mvtIntraInteface">
                <div class="modale--header">
                    <button type="button" class="modale--closeBtn"> × </button>
                    <div class="modale--presentation">Recherche d'écoles à proximité</div>
                </div>
                <section class="modale--stepAdresse">
                    <p>Renseignez une adresse de référence pour trouver les écoles les plus proches.</p>
                    <div class="modale--inputAdresseDiv">
                        <input type="text" class="modale--inputAdresse">
                        <div class="adressesSuggestions"></div>
                    </div>
                    <button type="button" class="modale--stepAdresse--btn">Rechercher</button>
                </section>
                <section class="modale--stepFilres hiddenModale">

                    <div class="modale--rappelAdresse">
                        <div class="adresseSelectionnee">
                            <span>📍</span>
                            <span class="adresseSelectionnee--label"></span>
                        </div>
                        <button type="button" id="modifierAdresse">✏️</button>
                    </div>

                    <div class="modale--typeEcoleDiv">
                        <fieldset>
                            <legend>TYPE D'ÉCOLE</legend>
                            <div>
                                <input type="checkbox" id="maternelle" checked>
                                <label for="maternelle">Maternelle</label>
                            </div>
                            <div>
                                <input type="checkbox" id="elementaire" checked>
                                <label for="elementaire">Elémentaire</label>
                            </div>
                            <div>
                                <input type="checkbox" id="primaire" checked>
                                <label for="primaire">Primaire</label>
                            </div>
                        </fieldset>
                    </div>
                    <div class="modale--nombreClasses">
                        <fieldset>
                            <legend>NOMBRE DE CLASSES</legend>
                            <label for="min">minimum</label>
                            <input type="number" id="min" min="1" value="1">
                            <label for="max">maximum</label>
                            <input type="number" id="max" max="30" value="30">
                        </fieldset>
                    </div>
                    <div class="modale--rep">
                        <fieldset>
                            <legend>Souhaitez-vous des écoles en REP ? </legend>
                            <div>
                                <input type="radio" id="oui" name="rep">
                                <label for="oui">oui</label>
                            </div>
                            <div>
                                <input type="radio" id="non" name="rep">
                                <label for="non">non</label>
                            </div>
                            <div>
                                <input type="radio" id="indif" name="rep">
                                <label for="indif">peu importe</label>
                            </div>
                        </fieldset>
                    </div>
                    <button type="submit">Rechercher</button>
                </section>
            </form>
        </div>
    </div>
</body>
</html>
